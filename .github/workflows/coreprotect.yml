name: CoreProtect Daily Build Check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CoreProtect repo
        uses: actions/checkout@v4
        with:
          repository: PlayPro/CoreProtect
          ref: development
          fetch-depth: 1

      - name: Get CoreProtect commit
        id: cp_commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        id: build
        run: mvn clean install -DskipTests
        continue-on-error: true

      - name: Check build status
        id: build_status
        run: |
          if ls target/CoreProtect*.jar >/dev/null 2>&1; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT
            ls -lh target/CoreProtect*.jar
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_OUTPUT
          fi

      - name: Handle JAR upload
        if: steps.build_status.outputs.BUILD_SUCCESS == 'true'
        id: jar_upload
        run: |
          JAR_FILE=$(ls target/CoreProtect*.jar | head -1)
          JAR_NAME=$(basename "$JAR_FILE")
          JAR_SIZE=$(stat -c%s "$JAR_FILE")
          JAR_SIZE_MB=$((JAR_SIZE / 1048576))

          echo "JAR_SIZE_MB=$JAR_SIZE_MB" >> $GITHUB_OUTPUT
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_OUTPUT

          if [ "$JAR_SIZE_MB" -gt 8 ]; then
            echo "LARGE_FILE=true" >> $GITHUB_OUTPUT
            CATBOX_URL=$(curl -F "reqtype=fileupload" -F "file=@$JAR_FILE" https://catbox.moe/user/api.php)
            echo "CATBOX_URL=$CATBOX_URL" >> $GITHUB_OUTPUT
          else
            echo "LARGE_FILE=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord Large file
        if: steps.build_status.outputs.BUILD_SUCCESS == 'true' && steps.jar_upload.outputs.LARGE_FILE == 'true'
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🎉 **CoreProtect Build Disponible**\n\n✅ Commit: \`${{ steps.cp_commit.outputs.short_sha }}\`\n📦 Tamaño: ${{ steps.jar_upload.outputs.JAR_SIZE_MB }}MB\n🔗 ${{ steps.jar_upload.outputs.CATBOX_URL }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notify Discord Small file
        if: steps.build_status.outputs.BUILD_SUCCESS == 'true' && steps.jar_upload.outputs.LARGE_FILE == 'false'
        run: |
          curl -X POST \
            -F "payload_json={\"content\":\"🎉 **CoreProtect Build Disponible**\n\n✅ Commit: \`${{ steps.cp_commit.outputs.short_sha }}\`\n📦 Tamaño: ${{ steps.jar_upload.outputs.JAR_SIZE_MB }}MB\"}" \
            -F "files[0]=@${{ steps.jar_upload.outputs.JAR_FILE }}" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notify Discord Build Failed
        if: steps.build_status.outputs.BUILD_SUCCESS != 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: '❌ CoreProtect Build Failed'
          description: |
            Commit: `${{ steps.cp_commit.outputs.short_sha }}`
            El build no generó JAR.
          color: ff0000
